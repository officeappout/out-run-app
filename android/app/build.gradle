apply plugin: 'com.android.application'

// ── Release signing — credentials live in android/keystore.properties (not committed) ──
// keystore.properties sits one level up from this build.gradle (in android/, not android/app/)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "co.il.appout.outrun"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.il.appout.outrun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 23
        versionName "1.23"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile value is relative to android/app/ where the .jks lives
                storeFile     rootProject.file("app/" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// androidx.datastore 1.1.x introduced a Kotlin Multiplatform split. Because this Capacitor
// module applies no Kotlin Gradle plugin, the consumer never requests the `androidJvm`
// variant, so firebase-sessions' transitive pull resolves to the -jvm artifact which omits
// the Android-only DataStoreFile class and causes a boot-time NoClassDefFoundError.
// Pinning to 1.0.0 sidesteps the issue entirely: the 1.0.x series predates the KMP split
// and ships only a pure-Android AAR, so no variant selection ambiguity exists.
configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'androidx.datastore') {
            details.useVersion '1.0.0'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.datastore:datastore:1.0.0"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}

apply from: 'capacitor.build.gradle'

// ── google-services.json guard ──────────────────────────────────────────────
// The file is gitignored, so a build from a checkout without it (a worktree, CI,
// another machine) used to SILENTLY skip Firebase + Crashlytics (an info log in a
// catch) and ship an app with no crash reporting, push or auth.
//   • RELEASE builds (any requested task naming a release variant, or the
//     variant-spanning build/assemble/bundle) FAIL if the file is missing, empty,
//     malformed, or has no client for this module's applicationId.
//   • debug / sync / everything else keeps the old soft behaviour (warn, skip).
// Matching by applicationId, not clients[0]: the file also holds the .dev app.
def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last().toLowerCase() }
def isReleaseBuild = requestedTasks.any {
    it.contains('release') || it in ['build', 'assemble', 'bundle']
}
def servicesJSON = file('google-services.json')
def servicesProblem = null
if (!servicesJSON.exists()) {
    servicesProblem = 'file not found'
} else if (servicesJSON.text.trim().isEmpty()) {
    servicesProblem = 'file is empty'
} else {
    try {
        def parsed = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
        def appId = android.defaultConfig.applicationId
        def hasClient = parsed.client?.any {
            it.client_info?.android_client_info?.package_name == appId
        }
        if (!hasClient) {
            servicesProblem = "no client for applicationId '${appId}'"
        }
    } catch (Exception e) {
        servicesProblem = "malformed JSON (${e.message})"
    }
}
if (servicesProblem == null) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else if (isReleaseBuild) {
    throw new GradleException(
        "android/app/google-services.json: ${servicesProblem}. Refusing to build a RELEASE without " +
        "Firebase/Crashlytics. Build from the main checkout that has the file (not a worktree), or " +
        "download it from Firebase Console → Project Settings → Android app. " +
        "Check with: node scripts/preflight-native-check.mjs --android")
} else {
    logger.warn("google-services.json: ${servicesProblem} — google-services/Crashlytics NOT applied " +
        "(non-release build). Push, Auth and Crash reporting will not work in this build.")
}
